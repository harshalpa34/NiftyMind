<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Primary Cyan-to-Purple Glow Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Neural Network Connections / Chart Grid Lines -->
  <path d="M12 48 H52 M12 36 H52 M12 24 H52" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />

  <!-- AI Brain / Stock Growth Surge Line -->
  <path d="M14 44 L26 34 L36 38 L50 18" stroke="url(#primary-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Neural Network Nodes -->
  <circle cx="14" cy="44" r="3.5" fill="#0ea5e9" stroke="#0b0f19" stroke-width="1.5" />
  <circle cx="26" cy="34" r="3.5" fill="#38bdf8" stroke="#0b0f19" stroke-width="1.5" />
  <circle cx="36" cy="38" r="3.5" fill="#818cf8" stroke="#0b0f19" stroke-width="1.5" />
  <circle cx="50" cy="18" r="4.5" fill="#c084fc" stroke="#0b0f19" stroke-width="1.5" filter="url(#glow)" />

  <!-- AI Spark / Intelligence Star -->
  <path d="M50 10 L51.5 15 L56.5 16.5 L51.5 18 L50 23 L48.5 18 L43.5 16.5 L48.5 15 Z" fill="#e0e7ff" />
</svg>